name: Phase 2

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this phase already ran
        id: check
        run: |
          if [ -f .phase-2-applied ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write gradle config
        if: steps.check.outputs.needed == 'true'
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.example.journal"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.journal"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 20261015
                  versionName = "0.2.0"
              }

              signingConfigs {
                  create("journal") {
                      storeFile = rootProject.file("keystore/journal.jks")
                      storePassword = "journal-continuity-key"
                      keyAlias = "journal"
                      keyPassword = "journal-continuity-key"
                      storeType = "JKS"
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("journal")
                  }
                  getByName("release") {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("journal")
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.03"))

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-process:2.8.6")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")

              implementation("androidx.work:work-runtime-ktx:2.9.1")
              implementation("androidx.exifinterface:exifinterface:1.3.7")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

      - name: Write data layer
        if: steps.check.outputs.needed == 'true'
        run: |
          PKG=app/src/main/java/com/example/journal/data
          mkdir -p "$PKG"

          cat > "$PKG/Task.kt" <<'EOF'
          package com.example.journal.data

          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.LocalDate

          data class Task(
              val id: Long,
              val title: String,
              val done: Boolean = false,
              val completedAt: Long? = null,
              val dueDate: LocalDate? = null,
              val dueTimeMinutes: Int? = null,
              val note: String = "",
              val notebookId: Long = NotebookSet.DEFAULT_ID,
              val createdAt: Long,
              val updatedAt: Long,
              val tags: List<String> = emptyList(),
          )

          object TaskCodec {

              fun encode(tasks: List<Task>): String {
                  val array = JSONArray()
                  tasks.forEach { task ->
                      val item = JSONObject()
                      item.put("id", task.id)
                      item.put("title", task.title)
                      item.put("done", task.done)
                      task.completedAt?.let { item.put("completedAt", it) }
                      task.dueDate?.let { item.put("dueDate", it.toString()) }
                      task.dueTimeMinutes?.let { item.put("dueTime", it) }
                      if (task.note.isNotBlank()) item.put("note", task.note)
                      item.put("notebook", task.notebookId)
                      item.put("createdAt", task.createdAt)
                      item.put("updatedAt", task.updatedAt)
                      array.put(item)
                  }
                  return array.toString()
              }

              fun decode(json: String): List<Task> = runCatching {
                  val array = JSONArray(json)
                  val out = mutableListOf<Task>()
                  for (i in 0 until array.length()) {
                      val item = array.optJSONObject(i) ?: continue
                      val title = item.optString("title")
                      if (title.isBlank()) continue

                      val due: LocalDate? = if (item.has("dueDate") && !item.isNull("dueDate")) {
                          runCatching { LocalDate.parse(item.optString("dueDate")) }.getOrNull()
                      } else null

                      val completed: Long? = if (item.has("completedAt") && !item.isNull("completedAt")) {
                          item.optLong("completedAt")
                      } else null

                      val dueTime: Int? = if (item.has("dueTime") && !item.isNull("dueTime")) {
                          item.optInt("dueTime")
                      } else null

                      out += Task(
                          id = item.optLong("id", 0L),
                          title = title,
                          done = item.optBoolean("done", false),
                          completedAt = completed,
                          dueDate = due,
                          dueTimeMinutes = dueTime,
                          note = item.optString("note"),
                          notebookId = item.optLong("notebook", NotebookSet.DEFAULT_ID),
                          createdAt = item.optLong("createdAt", 0L),
                          updatedAt = item.optLong("updatedAt", 0L),
                      )
                  }
                  out.filter { it.id > 0L }
              }.getOrDefault(emptyList())
          }
          EOF

          cat > "$PKG/TaskStore.kt" <<'EOF'
          package com.example.journal.data

          import android.content.Context
          import androidx.core.content.edit
          import javax.crypto.SecretKey

          /**
           * Tasks live as one encrypted blob, exactly like notebooks. Nothing about a
           * task needs to be readable before unlock, because there are no reminders and
           * no widget text, so tasks add no plaintext to the database.
           */
          class TaskStore(context: Context) {

              private val prefs = context.applicationContext
                  .getSharedPreferences("journal_tasks", Context.MODE_PRIVATE)

              fun load(key: SecretKey): List<Task> {
                  val cipherText = prefs.getString(KEY_BLOB, null) ?: return emptyList()
                  val iv = prefs.getString(KEY_IV, null) ?: return emptyList()
                  val json = runCatching { CryptoManager.decrypt(key, cipherText, iv) }.getOrNull()
                      ?: return emptyList()
                  return TaskCodec.decode(json)
              }

              fun save(key: SecretKey, tasks: List<Task>) {
                  val encrypted = CryptoManager.encrypt(key, TaskCodec.encode(tasks))
                  prefs.edit {
                      putString(KEY_BLOB, encrypted.cipherText)
                      putString(KEY_IV, encrypted.iv)
                  }
              }

              private companion object {
                  const val KEY_BLOB = "blob"
                  const val KEY_IV = "iv"
              }
          }
          EOF

          cat > "$PKG/EntryRepository.kt" <<'EOF'
          package com.example.journal.data

          import android.content.Context
          import android.net.Uri
          import androidx.room.withTransaction
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.LocalDate
          import javax.crypto.SecretKey

          class EntryRepository(
              private val dao: EntryDao,
              private val auth: AuthManager,
              private val database: JournalDatabase,
              private val context: Context,
              private val attachments: AttachmentStore = AttachmentStore(context),
              private val notebookStore: NotebookStore = NotebookStore(context),
              private val taskStore: TaskStore = TaskStore(context),
          ) {

              // ---------------------------------------------------------------- reading

              fun observeEntries(): Flow<List<JournalEntry>> = dao.observeAll().map(::decodeRows)

              private fun decodeRows(rows: List<Entry>): List<JournalEntry> {
                  val key = auth.currentKeyOrNull() ?: return emptyList()
                  return rows.mapNotNull { decodeRow(key, it) }
              }

              private fun decodeRow(key: SecretKey, row: Entry): JournalEntry? = runCatching {
                  val payload = PayloadCodec.decode(
                      CryptoManager.decrypt(key, row.cipherText, row.iv)
                  )
                  JournalEntry(
                      id = row.id,
                      date = LocalDate.parse(row.entryDate),
                      eventTime = payload.eventTime ?: row.createdAt,
                      recordedAt = row.createdAt,
                      updatedAt = row.updatedAt,
                      text = payload.text,
                      valence = payload.valence,
                      customMood = payload.customMood,
                      notebookId = payload.notebookId ?: NotebookSet.DEFAULT_ID,
                      locked = payload.locked,
                      attachments = payload.attachments,
                      tags = TagParser.tagsOf(payload.text),
                  )
              }.getOrNull()

              /** Every block on one day, oldest first. Used to build a day document. */
              suspend fun blocksForDay(date: LocalDate): List<JournalEntry> =
                  withContext(Dispatchers.IO) {
                      val key = auth.currentKeyOrNull() ?: return@withContext emptyList()
                      dao.getAll()
                          .filter { it.entryDate == date.toString() }
                          .mapNotNull { decodeRow(key, it) }
                          .sortedWith(compareBy({ it.eventTime }, { it.recordedAt }))
                  }

              // ---------------------------------------------------------------- writing

              suspend fun save(
                  id: Long?,
                  date: LocalDate,
                  eventTime: Long,
                  text: String,
                  valence: Int?,
                  customMood: String?,
                  notebookId: Long,
                  locked: Boolean,
                  attachmentNames: List<String>,
              ): Long {
                  val key = auth.currentKey()
                  val payload = EntryPayload(
                      text = text,
                      eventTime = eventTime,
                      valence = valence,
                      customMood = customMood,
                      notebookId = notebookId,
                      locked = locked,
                      attachments = attachmentNames,
                  )
                  val encrypted = CryptoManager.encrypt(key, PayloadCodec.encode(payload))
                  val now = System.currentTimeMillis()

                  if (id == null) {
                      return dao.insert(
                          Entry(
                              entryDate = date.toString(),
                              createdAt = now,
                              updatedAt = now,
                              cipherText = encrypted.cipherText,
                              iv = encrypted.iv,
                          )
                      )
                  }

                  val existing = dao.getById(id) ?: return -1L
                  val previous = runCatching {
                      PayloadCodec.decode(
                          CryptoManager.decrypt(key, existing.cipherText, existing.iv)
                      )
                  }.getOrNull()

                  dao.update(
                      existing.copy(
                          entryDate = date.toString(),
                          updatedAt = now,
                          cipherText = encrypted.cipherText,
                          iv = encrypted.iv,
                      )
                  )

                  previous?.attachments
                      ?.minus(attachmentNames.toSet())
                      ?.forEach { attachments.delete(it) }

                  return id
              }

              suspend fun delete(id: Long) {
                  val row = dao.getById(id) ?: return
                  auth.currentKeyOrNull()?.let { key ->
                      runCatching {
                          PayloadCodec.decode(CryptoManager.decrypt(key, row.cipherText, row.iv))
                      }.getOrNull()?.attachments?.forEach { attachments.delete(it) }
                  }
                  dao.deleteById(id)
              }

              // --------------------------------------------------------------- photos

              suspend fun addAttachment(bytes: ByteArray): String? = withContext(Dispatchers.IO) {
                  val key = auth.currentKeyOrNull() ?: return@withContext null
                  runCatching { attachments.save(key, bytes) }.getOrNull()
              }

              suspend fun loadAttachment(name: String): ByteArray? = withContext(Dispatchers.IO) {
                  val key = auth.currentKeyOrNull() ?: return@withContext null
                  attachments.load(key, name)
              }

              suspend fun cleanUpAttachments(): Int = withContext(Dispatchers.IO) {
                  val key = auth.currentKeyOrNull() ?: return@withContext 0
                  val referenced = dao.getAll().flatMapTo(mutableSetOf()) { row ->
                      runCatching {
                          PayloadCodec.decode(CryptoManager.decrypt(key, row.cipherText, row.iv))
                      }.getOrDefault(EntryPayload("")).attachments
                  }
                  attachments.collectGarbage(referenced)
              }

              // ------------------------------------------------------------ notebooks

              suspend fun notebooks(): NotebookSet = withContext(Dispatchers.IO) {
                  notebookStore.load(auth.currentKey())
              }

              suspend fun saveNotebooks(set: NotebookSet) = withContext(Dispatchers.IO) {
                  notebookStore.save(auth.currentKey(), set)
              }

              suspend fun reassignNotebook(notebookId: Long, fallbackId: Long): Int =
                  withContext(Dispatchers.IO) {
                      val key = auth.currentKey()
                      val rows = dao.getAll()
                      val changed = mutableListOf<Entry>()

                      rows.forEach { row ->
                          val payload = runCatching {
                              PayloadCodec.decode(
                                  CryptoManager.decrypt(key, row.cipherText, row.iv)
                              )
                          }.getOrNull() ?: return@forEach

                          val current = payload.notebookId ?: NotebookSet.DEFAULT_ID
                          if (current != notebookId) return@forEach

                          val encrypted = CryptoManager.encrypt(
                              key,
                              PayloadCodec.encode(payload.copy(notebookId = fallbackId)),
                          )
                          changed += row.copy(cipherText = encrypted.cipherText, iv = encrypted.iv)
                      }

                      if (changed.isNotEmpty()) dao.updateAll(changed)
                      changed.size
                  }

              // ---------------------------------------------------------------- tasks

              suspend fun tasks(): List<Task> = withContext(Dispatchers.IO) {
                  taskStore.load(auth.currentKey())
              }

              suspend fun saveTasks(tasks: List<Task>) = withContext(Dispatchers.IO) {
                  taskStore.save(auth.currentKey(), tasks)
              }

              suspend fun tasksForDay(date: LocalDate): List<Task> =
                  withContext(Dispatchers.IO) {
                      val key = auth.currentKeyOrNull() ?: return@withContext emptyList()
                      taskStore.load(key).filter { task ->
                          task.dueDate == date || completedOn(task, date)
                      }
                  }

              private fun completedOn(task: Task, date: LocalDate): Boolean {
                  val stamp = task.completedAt ?: return false
                  return java.time.Instant.ofEpochMilli(stamp)
                      .atZone(java.time.ZoneId.systemDefault())
                      .toLocalDate() == date
              }

              // ---------------------------------------------------------- password

              suspend fun changePassword(current: CharArray, new: CharArray): Boolean {
                  if (!auth.unlock(current)) return false

                  val oldKey = auth.currentKey()
                  val rows = dao.getAll()
                  val notebooks = notebookStore.load(oldKey)
                  val tasks = taskStore.load(oldKey)

                  val newSalt = CryptoManager.newSalt()
                  val newKey = CryptoManager.deriveKey(new, newSalt)

                  val reEncrypted = rows.map { row ->
                      val plain = CryptoManager.decrypt(oldKey, row.cipherText, row.iv)
                      val encrypted = CryptoManager.encrypt(newKey, plain)
                      row.copy(cipherText = encrypted.cipherText, iv = encrypted.iv)
                  }

                  database.withTransaction { dao.updateAll(reEncrypted) }
                  notebookStore.save(newKey, notebooks)
                  taskStore.save(newKey, tasks)
                  auth.replacePassword(newSalt, newKey)
                  return true
              }

              // ------------------------------------------------------------- backup

              suspend fun exportTo(uri: Uri): Int = withContext(Dispatchers.IO) {
                  val key = auth.currentKey()
                  val salt = auth.saltCopy() ?: error("The journal has no password set.")
                  val rows = dao.getAll()

                  val entriesJson = JSONArray()
                  rows.forEach { row ->
                      val payload = PayloadCodec.decode(
                          CryptoManager.decrypt(key, row.cipherText, row.iv)
                      )

                      val photosJson = JSONArray()
                      payload.attachments.forEach { name ->
                          attachments.load(key, name)?.let { bytes ->
                              val photo = JSONObject()
                              photo.put("name", name)
                              photo.put("data", CryptoManager.encode(bytes))
                              photosJson.put(photo)
                          }
                      }

                      val item = JSONObject()
                      item.put("date", row.entryDate)
                      item.put("recordedAt", row.createdAt)
                      item.put("eventTime", payload.eventTime ?: row.createdAt)
                      item.put("updatedAt", row.updatedAt)
                      item.put("text", payload.text)
                      payload.valence?.let { item.put("valence", it) }
                      payload.customMood?.let { item.put("customMood", it) }
                      payload.notebookId?.let { item.put("notebook", it) }
                      if (payload.locked) item.put("locked", true)
                      if (photosJson.length() > 0) item.put("attachments", photosJson)
                      entriesJson.put(item)
                  }

                  val inner = JSONObject()
                  inner.put("version", 5)
                  inner.put("notebooks", encodeNotebooks(notebookStore.load(key)))
                  inner.put("tasks", JSONArray(TaskCodec.encode(taskStore.load(key))))
                  inner.put("entries", entriesJson)

                  val encrypted = CryptoManager.encrypt(key, inner.toString())

                  val envelope = JSONObject()
                  envelope.put("app", "journal")
                  envelope.put("version", 5)
                  envelope.put("exportedAt", System.currentTimeMillis())

                  val kdf = JSONObject()
                  kdf.put("algo", CryptoManager.PBKDF2_ALGORITHM)
                  kdf.put("iterations", CryptoManager.ITERATIONS)
                  kdf.put("salt", CryptoManager.encode(salt))
                  envelope.put("kdf", kdf)

                  val cipher = JSONObject()
                  cipher.put("algo", CryptoManager.TRANSFORMATION)
                  cipher.put("iv", encrypted.iv)
                  cipher.put("data", encrypted.cipherText)
                  envelope.put("cipher", cipher)

                  context.contentResolver.openOutputStream(uri).use { stream ->
                      if (stream == null) error("Could not open the destination file.")
                      stream.write(envelope.toString(2).toByteArray(Charsets.UTF_8))
                  }
                  rows.size
              }

              suspend fun importFrom(uri: Uri, password: CharArray): Int =
                  withContext(Dispatchers.IO) {
                      val fileText = context.contentResolver.openInputStream(uri)?.use {
                          it.readBytes().toString(Charsets.UTF_8)
                      } ?: error("Could not read that file.")

                      val envelope = runCatching { JSONObject(fileText) }
                          .getOrElse { error("That file isn't a readable Journal backup.") }
                      require(envelope.optString("app") == "journal") {
                          "That file isn't a Journal backup."
                      }

                      val kdf = envelope.getJSONObject("kdf")
                      val cipher = envelope.getJSONObject("cipher")
                      val salt = CryptoManager.decode(kdf.getString("salt"))
                      val iterations = kdf.optInt("iterations", CryptoManager.ITERATIONS)

                      val fileKey = CryptoManager.deriveKey(password, salt, iterations)
                      val inner = runCatching {
                          CryptoManager.decrypt(
                              fileKey,
                              cipher.getString("data"),
                              cipher.getString("iv"),
                          )
                      }.getOrElse { error("Wrong password for this backup, or the file is damaged.") }

                      val root = runCatching { JSONObject(inner) }
                          .getOrElse { error("This backup looks corrupted inside.") }
                      val incoming = runCatching { root.getJSONArray("entries") }
                          .getOrElse { error("This backup has no entries in it.") }

                      val key = auth.currentKey()
                      val merged = mergeNotebooks(
                          notebookStore.load(key),
                          root.optJSONArray("notebooks"),
                      )
                      notebookStore.save(key, merged)
                      val known = merged.notebooks.map { it.id }.toSet()
                      val fallback = merged.displayOrder.firstOrNull()?.id ?: NotebookSet.DEFAULT_ID

                      // Tasks are re-numbered so an imported task can never overwrite one
                      // that is already here.
                      val existingTasks = taskStore.load(key)
                      var nextTaskId = (existingTasks.maxOfOrNull { it.id } ?: 0L) + 1L
                      val importedTasks = runCatching {
                          TaskCodec.decode(root.optJSONArray("tasks")?.toString() ?: "[]")
                      }.getOrDefault(emptyList()).map { task ->
                          val fresh = task.copy(
                              id = nextTaskId,
                              notebookId = if (task.notebookId in known) task.notebookId else fallback,
                          )
                          nextTaskId += 1L
                          fresh
                      }
                      if (importedTasks.isNotEmpty()) {
                          taskStore.save(key, existingTasks + importedTasks)
                      }

                      val now = System.currentTimeMillis()
                      val rows = mutableListOf<Entry>()
                      for (i in 0 until incoming.length()) {
                          val item = incoming.optJSONObject(i) ?: continue
                          val date = runCatching { LocalDate.parse(item.getString("date")) }
                              .getOrNull() ?: continue
                          val text = item.optString("text")
                          if (text.isBlank()) continue

                          val valence = if (item.has("valence") && !item.isNull("valence")) {
                              item.optInt("valence").coerceIn(MoodScale.MIN, MoodScale.MAX)
                          } else null
                          val custom = item.optString("customMood")
                              .takeIf { it.isNotBlank() && !item.isNull("customMood") }
                          val recordedAt = item.optLong("recordedAt", now)
                          val eventTime = item.optLong("eventTime", recordedAt)
                          val notebook = item.optLong("notebook", 0L).takeIf { it in known }

                          val photos = item.optJSONArray("attachments")
                          val names = mutableListOf<String>()
                          if (photos != null) {
                              for (p in 0 until photos.length()) {
                                  val photo = photos.optJSONObject(p) ?: continue
                                  val bytes = runCatching {
                                      CryptoManager.decode(photo.getString("data"))
                                  }.getOrNull() ?: continue
                                  runCatching { attachments.save(key, bytes) }
                                      .getOrNull()?.let { names += it }
                              }
                          }

                          val encrypted = CryptoManager.encrypt(
                              key,
                              PayloadCodec.encode(
                                  EntryPayload(
                                      text = text,
                                      eventTime = eventTime,
                                      valence = valence,
                                      customMood = custom,
                                      notebookId = notebook ?: fallback,
                                      locked = item.optBoolean("locked", false),
                                      attachments = names,
                                  )
                              ),
                          )

                          rows += Entry(
                              entryDate = date.toString(),
                              createdAt = recordedAt,
                              updatedAt = item.optLong("updatedAt", now),
                              cipherText = encrypted.cipherText,
                              iv = encrypted.iv,
                          )
                      }

                      if (rows.isNotEmpty()) dao.insertAll(rows)
                      rows.size
                  }

              private fun encodeNotebooks(set: NotebookSet): JSONArray {
                  val array = JSONArray()
                  set.notebooks.forEach { notebook ->
                      val item = JSONObject()
                      item.put("id", notebook.id)
                      item.put("name", notebook.name)
                      item.put("pinned", notebook.pinned)
                      item.put("order", notebook.order)
                      array.put(item)
                  }
                  return array
              }

              private fun mergeNotebooks(local: NotebookSet, incoming: JSONArray?): NotebookSet {
                  if (incoming == null || incoming.length() == 0) return local
                  val byId = local.notebooks.associateBy { it.id }.toMutableMap()
                  for (i in 0 until incoming.length()) {
                      val item = incoming.optJSONObject(i) ?: continue
                      val id = item.optLong("id", 0L)
                      val name = item.optString("name")
                      if (id <= 0L || name.isBlank() || byId.containsKey(id)) continue
                      byId[id] = Notebook(
                          id = id,
                          name = name,
                          pinned = item.optBoolean("pinned", false),
                          order = item.optInt("order", byId.size),
                      )
                  }
                  return NotebookSet(byId.values.sortedBy { it.order })
              }
          }
          EOF

      - name: Write helpers
        if: steps.check.outputs.needed == 'true'
        run: |
          PKG=app/src/main/java/com/example/journal/ui
          mkdir -p "$PKG"

          cat > "$PKG/DateUtils.kt" <<'EOF'
          package com.example.journal.ui

          import java.time.Instant
          import java.time.LocalDate
          import java.time.LocalTime
          import java.time.ZoneId
          import java.time.ZoneOffset
          import java.time.format.DateTimeFormatter

          private val longDate = DateTimeFormatter.ofPattern("EEEE, d MMMM yyyy")
          private val shortDate = DateTimeFormatter.ofPattern("d MMM yyyy")
          private val stamp = DateTimeFormatter.ofPattern("d MMM yyyy, HH:mm")
          private val clock = DateTimeFormatter.ofPattern("HH:mm")

          fun LocalDate.toUtcMillis(): Long =
              atStartOfDay(ZoneOffset.UTC).toInstant().toEpochMilli()

          fun Long.utcToLocalDate(): LocalDate =
              Instant.ofEpochMilli(this).atZone(ZoneOffset.UTC).toLocalDate()

          fun LocalDate.prettyLabel(): String {
              val today = LocalDate.now()
              val base = format(longDate)
              return when (this) {
                  today -> "Today · " + base
                  today.minusDays(1) -> "Yesterday · " + base
                  else -> base
              }
          }

          fun LocalDate.shortLabel(): String = format(shortDate)

          fun Long.stampLabel(): String =
              Instant.ofEpochMilli(this).atZone(ZoneId.systemDefault()).format(stamp)

          fun Long.timeLabel(): String =
              Instant.ofEpochMilli(this).atZone(ZoneId.systemDefault()).format(clock)

          fun Long.hourOfDay(): Int =
              Instant.ofEpochMilli(this).atZone(ZoneId.systemDefault()).hour

          fun Long.minuteOfHour(): Int =
              Instant.ofEpochMilli(this).atZone(ZoneId.systemDefault()).minute

          fun LocalDate.atTimeOfDay(hour: Int, minute: Int): Long =
              atTime(LocalTime.of(hour.coerceIn(0, 23), minute.coerceIn(0, 59)))
                  .atZone(ZoneId.systemDefault())
                  .toInstant()
                  .toEpochMilli()

          /** The moment "now" on a given day, used when backfilling a block. */
          fun LocalDate.withCurrentTimeOfDay(): Long {
              val now = LocalTime.now()
              return atTimeOfDay(now.hour, now.minute)
          }

          fun minutesToLabel(minutes: Int): String =
              "%02d:%02d".format(minutes / 60, minutes % 60)

          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.window.Dialog

          @Composable
          fun SectionPhotos(
              names: List<String>,
              thumbnailFor: suspend (String) -> ImageBitmap?,
              fullImageFor: suspend (String) -> ImageBitmap?,
          ) {
              if (names.isEmpty()) return
              var viewing by remember { mutableStateOf<String?>(null) }

              LazyRow(
                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                  modifier = Modifier.padding(top = 6.dp),
              ) {
                  items(names.size) { index ->
                      val name = names[index]
                      Thumbnail(
                          name = name,
                          thumbnailFor = thumbnailFor,
                          onClick = { viewing = name },
                      )
                  }
              }

              viewing?.let { name ->
                  PhotoViewer(
                      name = name,
                      fullImageFor = fullImageFor,
                      onDismiss = { viewing = null },
                  )
              }
          }

          @Composable
          private fun Thumbnail(
              name: String,
              thumbnailFor: suspend (String) -> ImageBitmap?,
              onClick: () -> Unit,
          ) {
              val bitmap by produceState<ImageBitmap?>(initialValue = null, name) {
                  value = thumbnailFor(name)
              }

              Box(
                  modifier = Modifier
                      .size(84.dp)
                      .clip(RoundedCornerShape(12.dp))
                      .background(MaterialTheme.colorScheme.surfaceVariant)
                      .clickable(onClick = onClick),
                  contentAlignment = Alignment.Center,
              ) {
                  val picture = bitmap
                  if (picture == null) {
                      CircularProgressIndicator(modifier = Modifier.size(20.dp))
                  } else {
                      Image(
                          bitmap = picture,
                          contentDescription = null,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxWidth(),
                      )
                  }
              }
          }

          @Composable
          private fun PhotoViewer(
              name: String,
              fullImageFor: suspend (String) -> ImageBitmap?,
              onDismiss: () -> Unit,
          ) {
              val bitmap by produceState<ImageBitmap?>(initialValue = null, name) {
                  value = fullImageFor(name)
              }

              Dialog(onDismissRequest = onDismiss) {
                  Surface(shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                      Column(
                          modifier = Modifier.padding(12.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                      ) {
                          val picture = bitmap
                          if (picture == null) {
                              CircularProgressIndicator(modifier = Modifier.padding(32.dp))
                          } else {
                              Image(
                                  bitmap = picture,
                                  contentDescription = null,
                                  contentScale = ContentScale.Fit,
                                  modifier = Modifier.fillMaxWidth(),
                              )
                          }
                          Text(
                              text = "Tap outside to close",
                              style = MaterialTheme.typography.labelSmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              modifier = Modifier.padding(top = 8.dp),
                          )
                      }
                  }
              }
          }

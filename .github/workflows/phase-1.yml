name: Phase 1

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this phase already ran
        id: check
        run: |
          if [ -f .phase-1-applied ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write data layer
        if: steps.check.outputs.needed == 'true'
        run: |
          PKG=app/src/main/java/com/example/journal/data
          mkdir -p "$PKG"

          cat > "$PKG/MoodScale.kt" <<'EOF'
          package com.example.journal.data

          import android.content.Context
          import androidx.core.content.edit
          import org.json.JSONArray
          import org.json.JSONObject

          data class MoodLevel(val emoji: String, val label: String)

          /**
           * Five fixed levels from -2 to +2. Only the emoji and the label are yours to
           * change. Entries store the number, so re-skinning a level instantly restyles
           * every past entry and keeps trend maths valid.
           */
          data class MoodScale(val levels: List<MoodLevel>) {

              fun emojiFor(valence: Int): String? = levels.getOrNull(valence + OFFSET)?.emoji

              fun labelFor(valence: Int): String? = levels.getOrNull(valence + OFFSET)?.label

              fun withEmoji(index: Int, emoji: String): MoodScale = copy(
                  levels = levels.mapIndexed { i, level ->
                      if (i == index) level.copy(emoji = emoji) else level
                  }
              )

              fun withLabel(index: Int, label: String): MoodScale = copy(
                  levels = levels.mapIndexed { i, level ->
                      if (i == index) level.copy(label = label) else level
                  }
              )

              companion object {
                  const val OFFSET = 2
                  const val MIN = -2
                  const val MAX = 2

                  val DEFAULT = MoodScale(
                      listOf(
                          MoodLevel("\uD83D\uDE23", "Bad"),
                          MoodLevel("\uD83D\uDE14", "Low"),
                          MoodLevel("\uD83D\uDE10", "Neutral"),
                          MoodLevel("\uD83D\uDE42", "Good"),
                          MoodLevel("\uD83D\uDE04", "Great"),
                      )
                  )

                  /** Emoji used before moods carried a number. Mapped once, at read time. */
                  private val LEGACY = mapOf(
                      "\uD83D\uDE04" to 2, "\uD83E\uDD29" to 2,
                      "\uD83D\uDE42" to 1,
                      "\uD83D\uDE10" to 0, "\uD83D\uDE34" to 0, "\uD83E\uDD14" to 0,
                      "\uD83D\uDE14" to -1, "\uD83E\uDD72" to -1,
                      "\uD83D\uDE23" to -2, "\uD83D\uDE20" to -2,
                  )

                  fun legacyValence(emoji: String): Int? = LEGACY[emoji]
              }
          }

          class MoodScaleStore(context: Context) {

              private val prefs = context.applicationContext
                  .getSharedPreferences("journal_mood_scale", Context.MODE_PRIVATE)

              fun load(): MoodScale {
                  val raw = prefs.getString(KEY, null) ?: return MoodScale.DEFAULT
                  return runCatching {
                      val array = JSONArray(raw)
                      val levels = (0 until array.length()).mapNotNull { i ->
                          val item = array.optJSONObject(i) ?: return@mapNotNull null
                          val emoji = item.optString("e")
                          if (emoji.isBlank()) return@mapNotNull null
                          MoodLevel(emoji, item.optString("l"))
                      }
                      if (levels.size == 5) MoodScale(levels) else MoodScale.DEFAULT
                  }.getOrDefault(MoodScale.DEFAULT)
              }

              fun save(scale: MoodScale) {
                  val array = JSONArray()
                  scale.levels.forEach { level ->
                      val item = JSONObject()
                      item.put("e", level.emoji)
                      item.put("l", level.label)
                      array.put(item)
                  }
                  prefs.edit { putString(KEY, array.toString()) }
              }

              fun reset() {
                  prefs.edit { remove(KEY) }
              }

              private companion object {
                  const val KEY = "scale"
              }
          }
          EOF

          cat > "$PKG/Notebooks.kt" <<'EOF'
          package com.example.journal.data

          import android.content.Context
          import androidx.core.content.edit
          import org.json.JSONArray
          import org.json.JSONObject
          import javax.crypto.SecretKey

          data class Notebook(
              val id: Long,
              val name: String,
              val pinned: Boolean,
              val order: Int,
          )

          data class NotebookSet(val notebooks: List<Notebook>) {

              /** Pinned first, then by order, then by name: the order the chips appear in. */
              val displayOrder: List<Notebook>
                  get() = notebooks.sortedWith(
                      compareByDescending<Notebook> { it.pinned }
                          .thenBy { it.order }
                          .thenBy { it.name.lowercase() }
                  )

              fun byId(id: Long): Notebook? = notebooks.firstOrNull { it.id == id }

              fun nameOf(id: Long): String? = byId(id)?.name

              val firstId: Long? get() = displayOrder.firstOrNull()?.id

              companion object {
                  const val DEFAULT_ID = 1L
                  val DEFAULT = NotebookSet(
                      listOf(Notebook(DEFAULT_ID, "Journal", pinned = true, order = 0))
                  )
              }
          }

          /**
           * Notebook names are personal, so the whole set lives as one encrypted blob
           * rather than a plaintext table. There are only ever a handful, so decrypting
           * them all at unlock costs nothing.
           */
          class NotebookStore(context: Context) {

              private val prefs = context.applicationContext
                  .getSharedPreferences("journal_notebooks", Context.MODE_PRIVATE)

              fun load(key: SecretKey): NotebookSet {
                  val cipherText = prefs.getString(KEY_BLOB, null) ?: return NotebookSet.DEFAULT
                  val iv = prefs.getString(KEY_IV, null) ?: return NotebookSet.DEFAULT
                  val json = runCatching { CryptoManager.decrypt(key, cipherText, iv) }.getOrNull()
                      ?: return NotebookSet.DEFAULT
                  return decode(json)
              }

              fun save(key: SecretKey, set: NotebookSet) {
                  val encrypted = CryptoManager.encrypt(key, encode(set))
                  prefs.edit {
                      putString(KEY_BLOB, encrypted.cipherText)
                      putString(KEY_IV, encrypted.iv)
                  }
              }

              private fun encode(set: NotebookSet): String {
                  val array = JSONArray()
                  set.notebooks.forEach { notebook ->
                      val item = JSONObject()
                      item.put("id", notebook.id)
                      item.put("name", notebook.name)
                      item.put("pinned", notebook.pinned)
                      item.put("order", notebook.order)
                      array.put(item)
                  }
                  return array.toString()
              }

              private fun decode(json: String): NotebookSet = runCatching {
                  val array = JSONArray(json)
                  val notebooks = (0 until array.length()).mapNotNull { i ->
                      val item = array.optJSONObject(i) ?: return@mapNotNull null
                      val name = item.optString("name")
                      if (name.isBlank()) return@mapNotNull null
                      Notebook(
                          id = item.optLong("id", 0L),
                          name = name,
                          pinned = item.optBoolean("pinned", false),
                          order = item.optInt("order", 0),
                      )
                  }.filter { it.id > 0L }
                  if (notebooks.isEmpty()) NotebookSet.DEFAULT else NotebookSet(notebooks)
              }.getOrDefault(NotebookSet.DEFAULT)

              private companion object {
                  const val KEY_BLOB = "blob"
                  const val KEY_IV = "iv"
              }
          }
          EOF

          cat > "$PKG/Payload.kt" <<'EOF'
          package com.example.journal.data

          import org.json.JSONArray
          import org.json.JSONObject

          /**
           * Everything encrypted for one block: the text, the time it claims, its mood,
           * its notebook, the hidden flag and its photo names. None of it is plaintext.
           */
          data class EntryPayload(
              val text: String,
              val eventTime: Long? = null,
              val valence: Int? = null,
              val customMood: String? = null,
              val notebookId: Long? = null,
              val locked: Boolean = false,
              val attachments: List<String> = emptyList(),
          )

          object PayloadCodec {

              fun encode(payload: EntryPayload): String {
                  val json = JSONObject()
                  json.put("v", 4)
                  json.put("text", payload.text)
                  payload.eventTime?.let { json.put("eventTime", it) }
                  payload.valence?.let { json.put("valence", it) }
                  payload.customMood?.let { json.put("customMood", it) }
                  payload.notebookId?.let { json.put("notebook", it) }
                  if (payload.locked) json.put("locked", true)
                  if (payload.attachments.isNotEmpty()) {
                      json.put("attachments", JSONArray(payload.attachments))
                  }
                  return json.toString()
              }

              /**
               * Reads every version we have ever written. Blocks from before moods
               * carried a number still hold an emoji under "mood"; those are translated
               * to a valence here rather than in a migration pass.
               */
              fun decode(raw: String): EntryPayload {
                  if (!raw.trimStart().startsWith("{")) return EntryPayload(raw)
                  return try {
                      val json = JSONObject(raw)
                      if (!json.has("text")) return EntryPayload(raw)

                      val attachments = json.optJSONArray("attachments")?.let { array ->
                          (0 until array.length()).mapNotNull { i ->
                              val name = array.optString(i)
                              if (name.isBlank()) null else name
                          }
                      } ?: emptyList()

                      var valence: Int? = null
                      var customMood: String? = null

                      if (json.has("valence") && !json.isNull("valence")) {
                          valence = json.optInt("valence").coerceIn(MoodScale.MIN, MoodScale.MAX)
                      }

                      val legacy = json.optString("mood")
                      if (valence == null && legacy.isNotBlank() && !json.isNull("mood")) {
                          val mapped = MoodScale.legacyValence(legacy)
                          if (mapped != null) valence = mapped else customMood = legacy
                      }

                      val explicitCustom = json.optString("customMood")
                      if (explicitCustom.isNotBlank() && !json.isNull("customMood")) {
                          customMood = explicitCustom
                      }

                      var eventTime: Long? = null
                      if (json.has("eventTime") && !json.isNull("eventTime")) {
                          val value = json.optLong("eventTime", 0L)
                          if (value > 0L) eventTime = value
                      }

                      var notebookId: Long? = null
                      if (json.has("notebook") && !json.isNull("notebook")) {
                          val value = json.optLong("notebook", 0L)
                          if (value > 0L) notebookId = value
                      }

                      EntryPayload(
                          text = json.optString("text"),
                          eventTime = eventTime,
                          valence = valence,
                          customMood = customMood,
                          notebookId = notebookId,
                          locked = json.optBoolean("locked", false),
                          attachments = attachments,
                      )
                  } catch (t: Throwable) {
                      EntryPayload(raw)
                  }
              }
          }
          EOF

          cat > "$PKG/JournalEntry.kt" <<'EOF'
          package com.example.journal.data

          import java.time.LocalDate

          /** Decrypted, in-memory view of one block inside a day. */
          data class JournalEntry(
              val id: Long,
              val date: LocalDate,
              val eventTime: Long,
              val recordedAt: Long,
              val updatedAt: Long,
              val text: String,
              val valence: Int? = null,
              val customMood: String? = null,
              val notebookId: Long = NotebookSet.DEFAULT_ID,
              val locked: Boolean = false,
              val attachments: List<String> = emptyList(),
              val tags: List<String> = emptyList(),
          )
          EOF

          cat > "$PKG/SettingsStore.kt" <<'EOF'
          package com.example.journal.data

          import android.content.Context
          import androidx.core.content.edit

          class SettingsStore(context: Context) {

              private val prefs = context.applicationContext
                  .getSharedPreferences("journal_settings", Context.MODE_PRIVATE)

              var revealRecordedTimes: Boolean
                  get() = prefs.getBoolean(KEY_REVEAL, false)
                  set(value) = prefs.edit { putBoolean(KEY_REVEAL, value) }

              var collapseOldDays: Boolean
                  get() = prefs.getBoolean(KEY_COLLAPSE, true)
                  set(value) = prefs.edit { putBoolean(KEY_COLLAPSE, value) }

              /** Zero means the app never locks itself while it stays open. */
              var autoLockMillis: Long
                  get() = prefs.getLong(KEY_AUTO_LOCK, 2 * 60 * 1000L)
                  set(value) = prefs.edit { putLong(KEY_AUTO_LOCK, value) }

              var placeholder: String
                  get() = prefs.getString(KEY_PLACEHOLDER, "") ?: ""
                  set(value) = prefs.edit { putString(KEY_PLACEHOLDER, value) }

              var defaultNotebookId: Long
                  get() = prefs.getLong(KEY_DEFAULT_NOTEBOOK, NotebookSet.DEFAULT_ID)
                  set(value) = prefs.edit { putLong(KEY_DEFAULT_NOTEBOOK, value) }

              var reminderEnabled: Boolean
                  get() = prefs.getBoolean(KEY_REMINDER_ENABLED, false)
                  set(value) = prefs.edit { putBoolean(KEY_REMINDER_ENABLED, value) }

              var reminderHour: Int
                  get() = prefs.getInt(KEY_REMINDER_HOUR, 20)
                  set(value) = prefs.edit { putInt(KEY_REMINDER_HOUR, value) }

              var reminderMinute: Int
                  get() = prefs.getInt(KEY_REMINDER_MINUTE, 30)
                  set(value) = prefs.edit { putInt(KEY_REMINDER_MINUTE, value) }

              private companion object {
                  const val KEY_REVEAL = "reveal_recorded_times"
                  const val KEY_COLLAPSE = "collapse_old_days"
                  const val KEY_AUTO_LOCK = "auto_lock_millis"
                  const val KEY_PLACEHOLDER = "placeholder"
                  const val KEY_DEFAULT_NOTEBOOK = "default_notebook"
                  const val KEY_REMINDER_ENABLED = "reminder_enabled"
                  const val KEY_REMINDER_HOUR = "reminder_hour"
                  const val KEY_REMINDER_MINUTE = "reminder_minute"
              }
          }
          EOF

          cat > "$PKG/EntryRepository.kt" <<'EOF'
          package com.example.journal.data

          import android.content.Context
          import android.net.Uri
          import androidx.room.withTransaction
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.LocalDate

          class EntryRepository(
              private val dao: EntryDao,
              private val auth: AuthManager,
              private val database: JournalDatabase,
              private val context: Context,
              private val attachments: AttachmentStore = AttachmentStore(context),
              private val notebookStore: NotebookStore = NotebookStore(context),
          ) {

              fun observeEntries(): Flow<List<JournalEntry>> = dao.observeAll().map(::decryptAll)

              private fun decryptAll(rows: List<Entry>): List<JournalEntry> {
                  val key = auth.currentKeyOrNull() ?: return emptyList()
                  return rows.mapNotNull { row ->
                      runCatching {
                          val payload = PayloadCodec.decode(
                              CryptoManager.decrypt(key, row.cipherText, row.iv)
                          )
                          JournalEntry(
                              id = row.id,
                              date = LocalDate.parse(row.entryDate),
                              eventTime = payload.eventTime ?: row.createdAt,
                              recordedAt = row.createdAt,
                              updatedAt = row.updatedAt,
                              text = payload.text,
                              valence = payload.valence,
                              customMood = payload.customMood,
                              notebookId = payload.notebookId ?: NotebookSet.DEFAULT_ID,
                              locked = payload.locked,
                              attachments = payload.attachments,
                              tags = TagParser.tagsOf(payload.text),
                          )
                      }.getOrNull()
                  }
              }

              suspend fun save(
                  id: Long?,
                  date: LocalDate,
                  eventTime: Long,
                  text: String,
                  valence: Int?,
                  customMood: String?,
                  notebookId: Long,
                  locked: Boolean,
                  attachmentNames: List<String>,
              ): Long {
                  val key = auth.currentKey()
                  val payload = EntryPayload(
                      text = text,
                      eventTime = eventTime,
                      valence = valence,
                      customMood = customMood,
                      notebookId = notebookId,
                      locked = locked,
                      attachments = attachmentNames,
                  )
                  val encrypted = CryptoManager.encrypt(key, PayloadCodec.encode(payload))
                  val now = System.currentTimeMillis()

                  if (id == null) {
                      return dao.insert(
                          Entry(
                              entryDate = date.toString(),
                              createdAt = now,
                              updatedAt = now,
                              cipherText = encrypted.cipherText,
                              iv = encrypted.iv,
                          )
                      )
                  }

                  val existing = dao.getById(id) ?: return -1L
                  val previous = runCatching {
                      PayloadCodec.decode(
                          CryptoManager.decrypt(key, existing.cipherText, existing.iv)
                      )
                  }.getOrNull()

                  dao.update(
                      existing.copy(
                          entryDate = date.toString(),
                          updatedAt = now,
                          cipherText = encrypted.cipherText,
                          iv = encrypted.iv,
                      )
                  )

                  previous?.attachments
                      ?.minus(attachmentNames.toSet())
                      ?.forEach { attachments.delete(it) }

                  return id
              }

              suspend fun delete(id: Long) {
                  val row = dao.getById(id) ?: return
                  auth.currentKeyOrNull()?.let { key ->
                      runCatching {
                          PayloadCodec.decode(CryptoManager.decrypt(key, row.cipherText, row.iv))
                      }.getOrNull()?.attachments?.forEach { attachments.delete(it) }
                  }
                  dao.deleteById(id)
              }

              suspend fun addAttachment(bytes: ByteArray): String? = withContext(Dispatchers.IO) {
                  val key = auth.currentKeyOrNull() ?: return@withContext null
                  runCatching { attachments.save(key, bytes) }.getOrNull()
              }

              suspend fun loadAttachment(name: String): ByteArray? = withContext(Dispatchers.IO) {
                  val key = auth.currentKeyOrNull() ?: return@withContext null
                  attachments.load(key, name)
              }

              suspend fun cleanUpAttachments(): Int = withContext(Dispatchers.IO) {
                  val key = auth.currentKeyOrNull() ?: return@withContext 0
                  val referenced = dao.getAll().flatMapTo(mutableSetOf()) { row ->
                      runCatching {
                          PayloadCodec.decode(CryptoManager.decrypt(key, row.cipherText, row.iv))
                      }.getOrDefault(EntryPayload("")).attachments
                  }
                  attachments.collectGarbage(referenced)
              }

              // ------------------------------------------------------------- notebooks

              suspend fun notebooks(): NotebookSet = withContext(Dispatchers.IO) {
                  notebookStore.load(auth.currentKey())
              }

              suspend fun saveNotebooks(set: NotebookSet) = withContext(Dispatchers.IO) {
                  notebookStore.save(auth.currentKey(), set)
              }

              /** Moves every block out of [notebookId] into [fallbackId]. Returns how many moved. */
              suspend fun reassignNotebook(notebookId: Long, fallbackId: Long): Int =
                  withContext(Dispatchers.IO) {
                      val key = auth.currentKey()
                      val rows = dao.getAll()
                      val changed = mutableListOf<Entry>()

                      rows.forEach { row ->
                          val payload = runCatching {
                              PayloadCodec.decode(
                                  CryptoManager.decrypt(key, row.cipherText, row.iv)
                              )
                          }.getOrNull() ?: return@forEach

                          val current = payload.notebookId ?: NotebookSet.DEFAULT_ID
                          if (current != notebookId) return@forEach

                          val encrypted = CryptoManager.encrypt(
                              key,
                              PayloadCodec.encode(payload.copy(notebookId = fallbackId)),
                          )
                          changed += row.copy(cipherText = encrypted.cipherText, iv = encrypted.iv)
                      }

                      if (changed.isNotEmpty()) dao.updateAll(changed)
                      changed.size
                  }

              // ---------------------------------------------------------- password

              suspend fun changePassword(current: CharArray, new: CharArray): Boolean {
                  if (!auth.unlock(current)) return false

                  val oldKey = auth.currentKey()
                  val rows = dao.getAll()
                  val notebooks = notebookStore.load(oldKey)

                  val newSalt = CryptoManager.newSalt()
                  val newKey = CryptoManager.deriveKey(new, newSalt)

                  val reEncrypted = rows.map { row ->
                      val plain = CryptoManager.decrypt(oldKey, row.cipherText, row.iv)
                      val encrypted = CryptoManager.encrypt(newKey, plain)
                      row.copy(cipherText = encrypted.cipherText, iv = encrypted.iv)
                  }

                  database.withTransaction { dao.updateAll(reEncrypted) }
                  notebookStore.save(newKey, notebooks)
                  auth.replacePassword(newSalt, newKey)
                  return true
              }

              // ------------------------------------------------------------- backup

              suspend fun exportTo(uri: Uri): Int = withContext(Dispatchers.IO) {
                  val key = auth.currentKey()
                  val salt = auth.saltCopy() ?: error("The journal has no password set.")
                  val rows = dao.getAll()

                  val entriesJson = JSONArray()
                  rows.forEach { row ->
                      val payload = PayloadCodec.decode(
                          CryptoManager.decrypt(key, row.cipherText, row.iv)
                      )

                      val photosJson = JSONArray()
                      payload.attachments.forEach { name ->
                          attachments.load(key, name)?.let { bytes ->
                              val photo = JSONObject()
                              photo.put("name", name)
                              photo.put("data", CryptoManager.encode(bytes))
                              photosJson.put(photo)
                          }
                      }

                      val item = JSONObject()
                      item.put("date", row.entryDate)
                      item.put("recordedAt", row.createdAt)
                      item.put("eventTime", payload.eventTime ?: row.createdAt)
                      item.put("updatedAt", row.updatedAt)
                      item.put("text", payload.text)
                      payload.valence?.let { item.put("valence", it) }
                      payload.customMood?.let { item.put("customMood", it) }
                      payload.notebookId?.let { item.put("notebook", it) }
                      if (payload.locked) item.put("locked", true)
                      if (photosJson.length() > 0) item.put("attachments", photosJson)
                      entriesJson.put(item)
                  }

                  val inner = JSONObject()
                  inner.put("version", 4)
                  inner.put("notebooks", encodeNotebooks(notebookStore.load(key)))
                  inner.put("entries", entriesJson)

                  val encrypted = CryptoManager.encrypt(key, inner.toString())

                  val envelope = JSONObject()
                  envelope.put("app", "journal")
                  envelope.put("version", 4)
                  envelope.put("exportedAt", System.currentTimeMillis())

                  val kdf = JSONObject()
                  kdf.put("algo", CryptoManager.PBKDF2_ALGORITHM)
                  kdf.put("iterations", CryptoManager.ITERATIONS)
                  kdf.put("salt", CryptoManager.encode(salt))
                  envelope.put("kdf", kdf)

                  val cipher = JSONObject()
                  cipher.put("algo", CryptoManager.TRANSFORMATION)
                  cipher.put("iv", encrypted.iv)
                  cipher.put("data", encrypted.cipherText)
                  envelope.put("cipher", cipher)

                  context.contentResolver.openOutputStream(uri).use { stream ->
                      if (stream == null) error("Could not open the destination file.")
                      stream.write(envelope.toString(2).toByteArray(Charsets.UTF_8))
                  }
                  rows.size
              }

              suspend fun importFrom(uri: Uri, password: CharArray): Int = withContext(Dispatchers.IO) {
                  val fileText = context.contentResolver.openInputStream(uri)?.use {
                      it.readBytes().toString(Charsets.UTF_8)
                  } ?: error("Could not read that file.")

                  val envelope = runCatching { JSONObject(fileText) }
                      .getOrElse { error("That file isn't a readable Journal backup.") }
                  require(envelope.optString("app") == "journal") { "That file isn't a Journal backup." }

                  val kdf = envelope.getJSONObject("kdf")
                  val cipher = envelope.getJSONObject("cipher")
                  val salt = CryptoManager.decode(kdf.getString("salt"))
                  val iterations = kdf.optInt("iterations", CryptoManager.ITERATIONS)

                  val fileKey = CryptoManager.deriveKey(password, salt, iterations)
                  val inner = runCatching {
                      CryptoManager.decrypt(
                          fileKey,
                          cipher.getString("data"),
                          cipher.getString("iv"),
                      )
                  }.getOrElse { error("Wrong password for this backup, or the file is damaged.") }

                  val root = runCatching { JSONObject(inner) }
                      .getOrElse { error("This backup looks corrupted inside.") }
                  val incoming = runCatching { root.getJSONArray("entries") }
                      .getOrElse { error("This backup has no entries in it.") }

                  val key = auth.currentKey()
                  val merged = mergeNotebooks(notebookStore.load(key), root.optJSONArray("notebooks"))
                  notebookStore.save(key, merged)
                  val known = merged.notebooks.map { it.id }.toSet()
                  val fallback = merged.displayOrder.firstOrNull()?.id ?: NotebookSet.DEFAULT_ID

                  val now = System.currentTimeMillis()
                  val rows = buildList {
                      for (i in 0 until incoming.length()) {
                          val item = incoming.optJSONObject(i) ?: continue
                          val date = runCatching { LocalDate.parse(item.getString("date")) }
                              .getOrNull() ?: continue
                          val text = item.optString("text")
                          if (text.isBlank()) continue

                          val valence = if (item.has("valence") && !item.isNull("valence"))
                              item.optInt("valence").coerceIn(MoodScale.MIN, MoodScale.MAX) else null
                          val custom = item.optString("customMood")
                              .takeIf { it.isNotBlank() && !item.isNull("customMood") }
                          val recordedAt = item.optLong("recordedAt", now)
                          val eventTime = item.optLong("eventTime", recordedAt)
                          val notebook = item.optLong("notebook", 0L).takeIf { it in known }

                          val photos = item.optJSONArray("attachments")
                          val names = buildList {
                              if (photos != null) {
                                  for (p in 0 until photos.length()) {
                                      val photo = photos.optJSONObject(p) ?: continue
                                      val bytes = runCatching {
                                          CryptoManager.decode(photo.getString("data"))
                                      }.getOrNull() ?: continue
                                      runCatching { attachments.save(key, bytes) }
                                          .getOrNull()?.let { add(it) }
                                  }
                              }
                          }

                          val encrypted = CryptoManager.encrypt(
                              key,
                              PayloadCodec.encode(
                                  EntryPayload(
                                      text = text,
                                      eventTime = eventTime,
                                      valence = valence,
                                      customMood = custom,
                                      notebookId = notebook ?: fallback,
                                      locked = item.optBoolean("locked", false),
                                      attachments = names,
                                  )
                              ),
                          )

                          add(
                              Entry(
                                  entryDate = date.toString(),
                                  createdAt = recordedAt,
                                  updatedAt = item.optLong("updatedAt", now),
                                  cipherText = encrypted.cipherText,
                                  iv = encrypted.iv,
                              )
                          )
                      }
                  }

                  if (rows.isNotEmpty()) dao.insertAll(rows)
                  rows.size
              }

              private fun encodeNotebooks(set: NotebookSet): JSONArray {
                  val array = JSONArray()
                  set.notebooks.forEach { notebook ->
                      val item = JSONObject()
                      item.put("id", notebook.id)
                      item.put("name", notebook.name)
                      item.put("pinned", notebook.pinned)
                      item.put("order", notebook.order)
                      array.put(item)
                  }
                  return array
              }

              private fun mergeNotebooks(local: NotebookSet, incoming: JSONArray?): NotebookSet {
                  if (incoming == null || incoming.length() == 0) return local
                  val byId = local.notebooks.associateBy { it.id }.toMutableMap()
                  for (i in 0 until incoming.length()) {
                      val item = incoming.optJSONObject(i) ?: continue
                      val id = item.optLong("id", 0L)
                      val name = item.optString("name")
                      if (id <= 0L || name.isBlank() || byId.containsKey(id)) continue
                      byId[id] = Notebook(
                          id = id,
                          name = name,
                          pinned = item.optBoolean("pinned", false),
                          order = item.optInt("order", byId.size),
                      )
                  }
                  return NotebookSet(byId.values.sortedBy { it.order })
              }
          }
          EOF

      - name: Write view model and activity
        if: steps.check.outputs.needed == 'true'
        run: |
          PKG=app/src/main/java/com/example/journal
          mkdir -p "$PKG"

          cat > "$PKG/JournalViewModel.kt" <<'EOF'
          package com.example.journal

          import android.content.Context
          import android.net.Uri
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.ViewModelProvider
          import androidx.lifecycle.viewModelScope
          import com.example.journal.data.AuthManager
          import com.example.journal.data.EntryRepository
          import com.example.journal.data.ImageCompressor
          import com.example.journal.data.JournalEntry
          import com.example.journal.data.MoodScale
          import com.example.journal.data.MoodScaleStore
          import com.example.journal.data.Notebook
          import com.example.journal.data.NotebookSet
          import com.example.journal.data.SettingsStore
          import com.example.journal.ui.JournalStats
          import com.example.journal.ui.MoodPoint
          import com.example.journal.ui.OnThisDayHit
          import com.example.journal.ui.computeMoodSeries
          import com.example.journal.ui.computeOnThisDay
          import com.example.journal.ui.computeStats
          import com.example.journal.ui.decodeSampled
          import com.example.journal.ui.hourOfDay
          import com.example.journal.ui.minuteOfHour
          import com.example.journal.ui.timeLabel
          import com.example.journal.widget.JournalWidget
          import com.example.journal.work.ReminderScheduler
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.ExperimentalCoroutinesApi
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.flatMapLatest
          import kotlinx.coroutines.flow.flowOf
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.time.LocalDate

          sealed interface LockState {
              data object NeedsSetup : LockState
              data object Locked : LockState
              data object Unlocked : LockState
          }

          /**
           * The block open in the editor. It lives here rather than in the composable so
           * a background auto-lock never throws away unsaved text.
           */
          data class EditorState(
              val entryId: Long?,
              val originalText: String,
              val originalDate: LocalDate,
              val originalEventTime: Long,
              val originalValence: Int?,
              val originalCustomMood: String?,
              val originalNotebookId: Long,
              val originalLocked: Boolean,
              val originalAttachments: List<String>,
              val text: String,
              val date: LocalDate,
              val eventTime: Long,
              val valence: Int?,
              val customMood: String?,
              val notebookId: Long,
              val locked: Boolean,
              val attachments: List<String>,
              val merged: Boolean = false,
              val recordedAt: Long? = null,
              val updatedAt: Long? = null,
          ) {
              val isNew: Boolean get() = entryId == null

              val isDirty: Boolean
                  get() = text != originalText ||
                          date != originalDate ||
                          eventTime != originalEventTime ||
                          valence != originalValence ||
                          customMood != originalCustomMood ||
                          notebookId != originalNotebookId ||
                          locked != originalLocked ||
                          attachments != originalAttachments

              /** True while the merge banner can still be dismissed without losing typing. */
              val canUndoMerge: Boolean get() = merged && text == originalText
          }

          data class ReminderSettings(val enabled: Boolean, val hour: Int, val minute: Int)

          data class UiMessage(val id: Long, val text: String)

          @OptIn(ExperimentalCoroutinesApi::class)
          class JournalViewModel(
              private val repository: EntryRepository,
              private val auth: AuthManager,
              private val settings: SettingsStore,
              private val appContext: Context,
          ) : ViewModel() {

              private val moodScaleStore = MoodScaleStore(appContext)

              private val _lockState = MutableStateFlow<LockState>(
                  if (auth.hasPassword) LockState.Locked else LockState.NeedsSetup
              )
              val lockState: StateFlow<LockState> = _lockState.asStateFlow()

              private val _authError = MutableStateFlow<String?>(null)
              val authError: StateFlow<String?> = _authError.asStateFlow()

              private val _authBusy = MutableStateFlow(false)
              val authBusy: StateFlow<Boolean> = _authBusy.asStateFlow()

              private val _editor = MutableStateFlow<EditorState?>(null)
              val editor: StateFlow<EditorState?> = _editor.asStateFlow()

              private val _revealedEntries = MutableStateFlow<Set<Long>>(emptySet())
              val revealedEntries: StateFlow<Set<Long>> = _revealedEntries.asStateFlow()

              /** User overrides for day collapsing. Cleared whenever the journal locks. */
              private val _expansion = MutableStateFlow<Map<LocalDate, Boolean>>(emptyMap())
              val expansion: StateFlow<Map<LocalDate, Boolean>> = _expansion.asStateFlow()

              private val _notebooks = MutableStateFlow(NotebookSet.DEFAULT)
              val notebooks: StateFlow<NotebookSet> = _notebooks.asStateFlow()

              private val _moodScale = MutableStateFlow(moodScaleStore.load())
              val moodScale: StateFlow<MoodScale> = _moodScale.asStateFlow()

              private val _revealRecordedTimes = MutableStateFlow(settings.revealRecordedTimes)
              val revealRecordedTimes: StateFlow<Boolean> = _revealRecordedTimes.asStateFlow()

              private val _collapseOldDays = MutableStateFlow(settings.collapseOldDays)
              val collapseOldDays: StateFlow<Boolean> = _collapseOldDays.asStateFlow()

              private val _autoLockMillis = MutableStateFlow(settings.autoLockMillis)
              val autoLockMillis: StateFlow<Long> = _autoLockMillis.asStateFlow()

              private val _placeholder = MutableStateFlow(settings.placeholder)
              val placeholder: StateFlow<String> = _placeholder.asStateFlow()

              private val _defaultNotebookId = MutableStateFlow(settings.defaultNotebookId)
              val defaultNotebookId: StateFlow<Long> = _defaultNotebookId.asStateFlow()

              private val _reminder = MutableStateFlow(
                  ReminderSettings(settings.reminderEnabled, settings.reminderHour, settings.reminderMinute)
              )
              val reminder: StateFlow<ReminderSettings> = _reminder.asStateFlow()

              private val _message = MutableStateFlow<UiMessage?>(null)
              val message: StateFlow<UiMessage?> = _message.asStateFlow()

              private val _transferInProgress = MutableStateFlow(false)
              val transferInProgress: StateFlow<Boolean> = _transferInProgress.asStateFlow()

              private var pendingLock: Job? = null
              private var pendingNewEntry = false

              private val thumbnails = HashMap<String, ImageBitmap>()

              val entries: StateFlow<List<JournalEntry>> = _lockState
                  .flatMapLatest { state ->
                      if (state == LockState.Unlocked) repository.observeEntries()
                      else flowOf(emptyList())
                  }
                  .stateIn(viewModelScope, SharingStarted.Eagerly, emptyList())

              val stats: StateFlow<JournalStats> = entries
                  .map { computeStats(it) }
                  .stateIn(viewModelScope, SharingStarted.Eagerly, JournalStats())

              val moodSeries: StateFlow<List<MoodPoint>> = entries
                  .map { computeMoodSeries(it, 30, LocalDate.now()) }
                  .stateIn(viewModelScope, SharingStarted.Eagerly, emptyList())

              val onThisDay: StateFlow<List<OnThisDayHit>> = entries
                  .map { computeOnThisDay(it, LocalDate.now()) }
                  .stateIn(viewModelScope, SharingStarted.Eagerly, emptyList())

              init {
                  viewModelScope.launch {
                      stats.collect { current ->
                          if (_lockState.value == LockState.Unlocked && current.blocks > 0) {
                              JournalWidget.push(appContext, current)
                          }
                      }
                  }
              }

              // --------------------------------------------------------------- locking

              fun setupPassword(password: String, confirm: String) {
                  val error = when {
                      password.length < MIN_PASSWORD_LENGTH ->
                          "Use at least " + MIN_PASSWORD_LENGTH + " characters."
                      password != confirm -> "Those passwords don't match."
                      else -> null
                  }
                  if (error != null) {
                      _authError.value = error
                      return
                  }

                  _authBusy.value = true
                  viewModelScope.launch {
                      val created = withContext(Dispatchers.Default) {
                          auth.setupPassword(password.toCharArray())
                      }
                      _authBusy.value = false
                      if (!created) {
                          _authError.value = "This journal already has a password."
                          return@launch
                      }
                      _authError.value = null
                      _lockState.value = LockState.Unlocked
                      afterUnlock()
                  }
              }

              fun unlock(password: String) {
                  _authBusy.value = true
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.Default) {
                          auth.unlock(password.toCharArray())
                      }
                      _authBusy.value = false
                      _authError.value = if (ok) null else "Wrong password."
                      if (ok) {
                          _lockState.value = LockState.Unlocked
                          afterUnlock()
                      }
                  }
              }

              fun revealEntry(entryId: Long, password: String, onResult: (Boolean) -> Unit) {
                  viewModelScope.launch {
                      val ok = withContext(Dispatchers.Default) {
                          auth.unlock(password.toCharArray())
                      }
                      if (ok) _revealedEntries.update { it + entryId }
                      onResult(ok)
                  }
              }

              private fun afterUnlock() {
                  if (pendingNewEntry) {
                      pendingNewEntry = false
                      openNewEntry()
                  }
                  viewModelScope.launch {
                      val set = repository.notebooks()
                      _notebooks.value = set
                      repository.saveNotebooks(set)
                      repository.cleanUpAttachments()
                  }
              }

              fun requestNewEntry() {
                  if (_lockState.value == LockState.Unlocked) openNewEntry() else pendingNewEntry = true
              }

              fun lock() {
                  if (_lockState.value != LockState.Unlocked) return
                  pendingLock?.cancel()
                  pendingLock = null
                  auth.lock()
                  _revealedEntries.value = emptySet()
                  _expansion.value = emptyMap()
                  thumbnails.clear()
                  _lockState.value = LockState.Locked
              }

              fun scheduleLock() {
                  if (_lockState.value != LockState.Unlocked) return
                  val delayMillis = _autoLockMillis.value
                  if (delayMillis <= 0L) return
                  pendingLock?.cancel()
                  pendingLock = viewModelScope.launch {
                      delay(delayMillis)
                      lock()
                  }
              }

              fun cancelPendingLock() {
                  pendingLock?.cancel()
                  pendingLock = null
              }

              fun toggleDay(date: LocalDate, currentlyExpanded: Boolean) {
                  _expansion.update { it + (date to !currentlyExpanded) }
              }

              // ---------------------------------------------------------------- editor

              fun openNewEntry() = openNewEntry(LocalDate.now(), null)

              fun openNewEntry(date: LocalDate, notebookId: Long?) =
                  beginNewBlock(date, notebookId, forceNew = false)

              private fun beginNewBlock(date: LocalDate, notebookId: Long?, forceNew: Boolean) {
                  val target = notebookId ?: resolvedDefaultNotebookId()

                  if (!forceNew && date == LocalDate.now()) {
                      val now = System.currentTimeMillis()
                      val recent = entries.value
                          .filter { it.date == date && !it.locked && it.notebookId == target }
                          .maxByOrNull { it.updatedAt }
                      if (recent != null && now - recent.updatedAt <= MERGE_WINDOW_MILLIS) {
                          post("Continuing your " + recent.eventTime.timeLabel() + " block.")
                          openExisting(recent, merged = true)
                          return
                      }
                  }

                  val eventTime = date.atTimeOfDay(
                      System.currentTimeMillis().hourOfDay(),
                      System.currentTimeMillis().minuteOfHour(),
                  )
                  _editor.value = EditorState(
                      entryId = null,
                      originalText = "",
                      originalDate = date,
                      originalEventTime = eventTime,
                      originalValence = null,
                      originalCustomMood = null,
                      originalNotebookId = target,
                      originalLocked = false,
                      originalAttachments = emptyList(),
                      text = "",
                      date = date,
                      eventTime = eventTime,
                      valence = null,
                      customMood = null,
                      notebookId = target,
                      locked = false,
                      attachments = emptyList(),
                  )
              }

              /** Abandons a merge and starts a genuinely new block instead. */
              fun startNewBlock() {
                  val current = _editor.value ?: return
                  if (!current.canUndoMerge) return
                  beginNewBlock(current.date, current.notebookId, forceNew = true)
              }

              fun openEntry(entry: JournalEntry) = openExisting(entry, merged = false)

              private fun openExisting(entry: JournalEntry, merged: Boolean) {
                  _editor.value = EditorState(
                      entryId = entry.id,
                      originalText = entry.text,
                      originalDate = entry.date,
                      originalEventTime = entry.eventTime,
                      originalValence = entry.valence,
                      originalCustomMood = entry.customMood,
                      originalNotebookId = entry.notebookId,
                      originalLocked = entry.locked,
                      originalAttachments = entry.attachments,
                      text = entry.text,
                      date = entry.date,
                      eventTime = entry.eventTime,
                      valence = entry.valence,
                      customMood = entry.customMood,
                      notebookId = entry.notebookId,
                      locked = entry.locked,
                      attachments = entry.attachments,
                      merged = merged,
                      recordedAt = entry.recordedAt,
                      updatedAt = entry.updatedAt,
                  )
              }

              fun updateText(text: String) {
                  _editor.update { it?.copy(text = text) }
              }

              fun setDate(date: LocalDate) {
                  _editor.update { current ->
                      if (current == null) null
                      else current.copy(
                          date = date,
                          eventTime = date.atTimeOfDay(
                              current.eventTime.hourOfDay(),
                              current.eventTime.minuteOfHour(),
                          ),
                      )
                  }
              }

              fun setTime(hour: Int, minute: Int) {
                  _editor.update { current ->
                      current?.copy(eventTime = current.date.atTimeOfDay(hour, minute))
                  }
              }

              fun setValence(valence: Int?) {
                  _editor.update { it?.copy(valence = valence, customMood = null) }
              }

              fun setCustomMood(emoji: String?) {
                  _editor.update { it?.copy(customMood = emoji, valence = null) }
              }

              fun setDraftNotebook(notebookId: Long) {
                  _editor.update { it?.copy(notebookId = notebookId) }
              }

              fun toggleDraftLock() {
                  _editor.update { it?.copy(locked = !it.locked) }
              }

              fun removePhoto(name: String) {
                  _editor.update { it?.copy(attachments = it.attachments - name) }
              }

              fun closeEditor() {
                  _editor.value = null
              }

              fun saveDraft() {
                  val draft = _editor.value ?: return
                  if (draft.text.isBlank()) return
                  viewModelScope.launch {
                      repository.save(
                          id = draft.entryId,
                          date = draft.date,
                          eventTime = draft.eventTime,
                          text = draft.text.trim(),
                          valence = draft.valence,
                          customMood = draft.customMood,
                          notebookId = draft.notebookId,
                          locked = draft.locked,
                          attachmentNames = draft.attachments,
                      )
                      _editor.value = null
                  }
              }

              fun deleteEntry(id: Long) {
                  viewModelScope.launch {
                      repository.delete(id)
                      if (_editor.value?.entryId == id) _editor.value = null
                  }
              }

              // ---------------------------------------------------------------- photos

              fun addPhotoFromUri(uri: Uri) {
                  ingestPhoto {
                      withContext(Dispatchers.IO) {
                          appContext.contentResolver.openInputStream(uri)?.use { it.readBytes() }
                      }
                  }
              }

              fun addPhotoFromFile(file: File) {
                  ingestPhoto {
                      withContext(Dispatchers.IO) {
                          val bytes = file.takeIf { it.isFile }?.readBytes()
                          file.delete()
                          bytes
                      }
                  }
              }

              private fun ingestPhoto(loader: suspend () -> ByteArray?) {
                  if (_editor.value == null) return
                  viewModelScope.launch {
                      val raw = loader()
                      if (raw == null) {
                          post("That picture could not be read.")
                          return@launch
                      }
                      val compressed = withContext(Dispatchers.Default) {
                          ImageCompressor.fromBytes(raw)
                      }
                      if (compressed == null) {
                          post("That file doesn't look like a picture.")
                          return@launch
                      }
                      val name = repository.addAttachment(compressed)
                      if (name == null) {
                          post("Could not save the picture.")
                          return@launch
                      }
                      _editor.update { it?.copy(attachments = it.attachments + name) }
                  }
              }

              suspend fun thumbnailFor(name: String): ImageBitmap? {
                  thumbnails[name]?.let { return it }
                  val bytes = repository.loadAttachment(name) ?: return null
                  val bitmap = withContext(Dispatchers.Default) { decodeSampled(bytes, 220) }
                  if (bitmap != null) {
                      if (thumbnails.size > 64) thumbnails.clear()
                      thumbnails[name] = bitmap
                  }
                  return bitmap
              }

              suspend fun fullImageFor(name: String): ImageBitmap? {
                  val bytes = repository.loadAttachment(name) ?: return null
                  return withContext(Dispatchers.Default) { decodeSampled(bytes, 2048) }
              }

              // ------------------------------------------------------------- notebooks

              private fun resolvedDefaultNotebookId(): Long {
                  val set = _notebooks.value
                  val configured = _defaultNotebookId.value
                  return if (set.byId(configured) != null) configured
                  else set.firstId ?: NotebookSet.DEFAULT_ID
              }

              fun createNotebook(name: String, select: Boolean = false) {
                  val trimmed = name.trim()
                  if (trimmed.isEmpty()) return
                  viewModelScope.launch {
                      val current = _notebooks.value
                      if (current.notebooks.any { it.name.equals(trimmed, ignoreCase = true) }) {
                          post("You already have a notebook called \"" + trimmed + "\".")
                          return@launch
                      }
                      val nextId = (current.notebooks.maxOfOrNull { it.id } ?: 0L) + 1L
                      val updated = NotebookSet(
                          current.notebooks +
                              Notebook(nextId, trimmed, pinned = false, order = current.notebooks.size)
                      )
                      repository.saveNotebooks(updated)
                      _notebooks.value = updated
                      if (select) _editor.update { it?.copy(notebookId = nextId) }
                  }
              }

              fun renameNotebook(id: Long, name: String) {
                  val trimmed = name.trim()
                  if (trimmed.isEmpty()) return
                  viewModelScope.launch {
                      val current = _notebooks.value
                      if (current.notebooks.any {
                              it.id != id && it.name.equals(trimmed, ignoreCase = true)
                          }
                      ) {
                          post("Another notebook is already called \"" + trimmed + "\".")
                          return@launch
                      }
                      val updated = NotebookSet(
                          current.notebooks.map {
                              if (it.id == id) it.copy(name = trimmed) else it
                          }
                      )
                      repository.saveNotebooks(updated)
                      _notebooks.value = updated
                  }
              }

              fun toggleNotebookPin(id: Long) {
                  viewModelScope.launch {
                      val current = _notebooks.value
                      val updated = NotebookSet(
                          current.notebooks.map {
                              if (it.id == id) it.copy(pinned = !it.pinned) else it
                          }
                      )
                      repository.saveNotebooks(updated)
                      _notebooks.value = updated
                  }
              }

              fun deleteNotebook(id: Long) {
                  viewModelScope.launch {
                      val current = _notebooks.value
                      if (current.notebooks.size <= 1) {
                          post("Keep at least one notebook.")
                          return@launch
                      }
                      val remaining = current.notebooks.filterNot { it.id == id }
                      val fallback = NotebookSet(remaining).displayOrder.first().id
                      val moved = repository.reassignNotebook(id, fallback)
                      val updated = NotebookSet(remaining)
                      repository.saveNotebooks(updated)
                      _notebooks.value = updated

                      if (_defaultNotebookId.value == id) setDefaultNotebook(fallback)
                      if (_editor.value?.notebookId == id) {
                          _editor.update { it?.copy(notebookId = fallback) }
                      }
                      post(
                          if (moved == 0) "Notebook removed."
                          else "Notebook removed and " + moved + " block(s) moved."
                      )
                  }
              }

              // -------------------------------------------------------------- settings

              fun setRevealRecordedTimes(value: Boolean) {
                  settings.revealRecordedTimes = value
                  _revealRecordedTimes.value = value
              }

              fun setCollapseOldDays(value: Boolean) {
                  settings.collapseOldDays = value
                  _collapseOldDays.value = value
              }

              fun setAutoLock(millis: Long) {
                  settings.autoLockMillis = millis
                  _autoLockMillis.value = millis
                  if (millis > 0L && pendingLock != null) scheduleLock()
              }

              fun setPlaceholder(value: String) {
                  settings.placeholder = value
                  _placeholder.value = value
              }

              fun setDefaultNotebook(id: Long) {
                  settings.defaultNotebookId = id
                  _defaultNotebookId.value = id
              }

              fun setMoodEmoji(index: Int, emoji: String) {
                  val updated = _moodScale.value.withEmoji(index, emoji)
                  moodScaleStore.save(updated)
                  _moodScale.value = updated
              }

              fun setMoodLabel(index: Int, label: String) {
                  val updated = _moodScale.value.withLabel(index, label)
                  moodScaleStore.save(updated)
                  _moodScale.value = updated
              }

              fun resetMoodScale() {
                  moodScaleStore.reset()
                  _moodScale.value = MoodScale.DEFAULT
                  post("Mood scale reset.")
              }

              fun setReminder(enabled: Boolean, hour: Int, minute: Int) {
                  settings.reminderEnabled = enabled
                  settings.reminderHour = hour
                  settings.reminderMinute = minute
                  _reminder.value = ReminderSettings(enabled, hour, minute)

                  if (enabled) {
                      ReminderScheduler.schedule(appContext, hour, minute)
                      post("Daily reminder set for " + "%02d:%02d".format(hour, minute) + ".")
                  } else {
                      ReminderScheduler.cancel(appContext)
                      post("Daily reminder turned off.")
                  }
              }

              fun changePassword(current: String, new: String, onResult: (String?) -> Unit) {
                  viewModelScope.launch {
                      val result = when {
                          new.length < MIN_PASSWORD_LENGTH ->
                              "New password must be at least " + MIN_PASSWORD_LENGTH + " characters."
                          withContext(Dispatchers.Default) {
                              repository.changePassword(current.toCharArray(), new.toCharArray())
                          } -> null
                          else -> "Current password is incorrect."
                      }
                      onResult(result)
                  }
              }

              // ---------------------------------------------------------------- backup

              fun exportTo(uri: Uri) {
                  _transferInProgress.value = true
                  viewModelScope.launch {
                      val result = runCatching { repository.exportTo(uri) }
                      _transferInProgress.value = false
                      post(
                          result.fold(
                              onSuccess = { count ->
                                  if (count == 0) "Nothing to export yet."
                                  else "Exported " + count + " " + blocks(count) + "."
                              },
                              onFailure = { "Export failed: " + (it.message ?: "unknown error") },
                          )
                      )
                  }
              }

              fun importFrom(uri: Uri, password: String) {
                  if (password.isBlank()) {
                      post("Enter the password for that backup.")
                      return
                  }
                  _transferInProgress.value = true
                  viewModelScope.launch {
                      val result = runCatching {
                          repository.importFrom(uri, password.toCharArray())
                      }
                      _transferInProgress.value = false
                      _notebooks.value = repository.notebooks()
                      post(
                          result.fold(
                              onSuccess = { count ->
                                  if (count == 0) "That backup had no blocks in it."
                                  else "Imported " + count + " " + blocks(count) + "."
                              },
                              onFailure = { it.message ?: "Import failed." },
                          )
                      )
                  }
              }

              // -------------------------------------------------------------- messages

              fun clearMessage() {
                  _message.value = null
              }

              private fun post(text: String) {
                  _message.value = UiMessage(System.nanoTime(), text)
              }

              private fun blocks(count: Int) = if (count == 1) "block" else "blocks"

              companion object {
                  const val MIN_PASSWORD_LENGTH = 6
                  const val MERGE_WINDOW_MILLIS = 30 * 60 * 1000L
              }
          }

          class JournalViewModelFactory(
              private val app: JournalApplication,
          ) : ViewModelProvider.Factory {

              @Suppress("UNCHECKED_CAST")
              override fun <T : ViewModel> create(modelClass: Class<T>): T {
                  if (modelClass.isAssignableFrom(JournalViewModel::class.java)) {
                      return JournalViewModel(
                          repository = app.repository,
                          auth = app.authManager,
                          settings = app.settingsStore,
                          appContext = app.applicationContext,
                      ) as T
                  }
                  throw IllegalArgumentException("Unknown ViewModel: " + modelClass.name)
              }
          }
          EOF


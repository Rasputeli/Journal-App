name: Fix 2

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this fix already ran
        id: check
        run: |
          if [ -f .fix-2-applied ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add the missing import
        if: steps.check.outputs.needed == 'true'
        run: |
          set -e
          VM=app/src/main/java/com/example/journal/JournalViewModel.kt

          if grep -q 'import com\.example\.journal\.ui\.shortLabel' "$VM"; then
            echo "Import already present, nothing to do."
          else
            sed -i 's|^import com\.example\.journal\.ui\.decodeSampled$|import com.example.journal.ui.decodeSampled\nimport com.example.journal.ui.shortLabel|' "$VM"
            echo "Inserted the shortLabel import."
          fi

          echo "--- imports now ---"
          grep 'import com.example.journal.ui' "$VM"

          echo "--- the line that failed ---"
          sed -n '398,404p' "$VM"

          printf 'Fix 2 has been applied.\n' > .fix-2-applied

      - name: Commit the patch
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "journal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Fix 2: import shortLabel in the view model"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Confirm the signing keystore is present
        run: |
          if [ -f keystore/journal.jks ]; then
            echo "Keystore found — this APK will upgrade the previous one in place."
          else
            echo "Keystore missing; generating one so this build still signs consistently."
            mkdir -p keystore
            keytool -genkeypair \
              -keystore keystore/journal.jks -storetype JKS -alias journal \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass journal-continuity-key -keypass journal-continuity-key \
              -dname "CN=Journal, O=Personal, C=US"
            git config user.name "journal-bot"
            git config user.email "actions@users.noreply.github.com"
            git add keystore/journal.jks
            git commit -m "Add signing keystore" || true
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: journal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          STAMP="$(date -u +%Y%m%d)"
          TAG="v0.2.0-$STAMP"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Journal 0.2.0 ($STAMP)" \
              --notes "Day documents with sections, notebook tabs, and tasks."
          fi

          if gh release view apk-latest > /dev/null 2>&1; then
            gh release upload apk-latest "$APK" --clobber
          else
            gh release create apk-latest "$APK" \
              --title "Latest build" \
              --notes "Always the newest APK."
          fi

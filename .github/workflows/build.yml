          cat > "$PKG/Stats.kt" <<'EOF'
          package com.example.journal.ui

          import com.example.journal.data.JournalEntry
          import java.time.LocalDate

          data class JournalStats(
              val entries: Int = 0,
              val daysWritten: Int = 0,
              val words: Int = 0,
              val currentStreak: Int = 0,
              val longestStreak: Int = 0,
          )

          private val whitespace = Regex("\\s+")

          fun countWords(text: String): Int =
              text.split(whitespace).count { word -> word.any(Char::isLetterOrDigit) }

          fun computeStats(entries: List<JournalEntry>, today: LocalDate = LocalDate.now()): JournalStats {
              if (entries.isEmpty()) return JournalStats()

              val dates = entries.map { it.date }.distinct()
              val descending = dates.sortedDescending()
              val ascending = dates.sorted()

              // A streak may start today or yesterday, so writing at 1am doesn't break it.
              var current = 0
              val latest = descending.first()
              if (latest == today || latest == today.minusDays(1)) {
                  var expected = latest
                  for (date in descending) {
                      if (date == expected) {
                          current++
                          expected = expected.minusDays(1)
                      } else if (date.isBefore(expected)) {
                          break
                      }
                  }
              }

              var longest = 0
              var run = 0
              var previousDate: LocalDate? = null
              for (date in ascending) {
                  val previous = previousDate
                  run = if (previous != null && previous.plusDays(1) == date) run + 1 else 1
                  if (run > longest) longest = run
                  previousDate = date
              }

              return JournalStats(
                  entries = entries.size,
                  daysWritten = dates.size,
                  words = entries.sumOf { countWords(it.text) },
                  currentStreak = current,
                  longestStreak = maxOf(longest, current),
              )
          }
          EOF

          cat > "$PKG/OnThisDay.kt" <<'EOF'
          package com.example.journal.ui

          import com.example.journal.data.JournalEntry
          import java.time.LocalDate

          data class OnThisDayHit(val label: String, val entry: JournalEntry)

          /** Looks back at the same day a day, week, month or year ago. */
          fun computeOnThisDay(entries: List<JournalEntry>, today: LocalDate): List<OnThisDayHit> {
              if (entries.isEmpty()) return emptyList()

              val byDate = entries.groupBy { it.date }
              val lookBacks = listOf(
                  today.minusDays(1) to "Yesterday",
                  today.minusWeeks(1) to "A week ago",
                  today.minusMonths(1) to "A month ago",
                  today.minusMonths(3) to "Three months ago",
                  today.minusMonths(6) to "Six months ago",
                  today.minusYears(1) to "A year ago",
              )

              return buildList {
                  lookBacks.forEach { (date, label) ->
                      byDate[date]?.forEach { add(OnThisDayHit(label, it)) }
                  }
              }
          }
          EOF


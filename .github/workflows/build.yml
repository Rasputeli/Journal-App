name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Decide whether the project needs scaffolding
        id: scaffold_check
        run: |
          if [ -f .journal-scaffolded ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------------
      - name: Write Gradle project files
        if: steps.scaffold_check.outputs.needed == 'true'
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Journal"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.25" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat > .gitignore <<'EOF'
          *.iml
          .gradle/
          /local.properties
          /.idea/
          .DS_Store
          /build
          /app/build
          /captures
          .externalNativeBuild
          .cxx
          EOF

          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.example.journal"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.journal"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.03"))

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-process:2.8.6")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")

              implementation("androidx.work:work-runtime-ktx:2.9.1")
              implementation("androidx.exifinterface:exifinterface:1.3.7")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          # Keep the default rules; nothing custom is required for this app.
          EOF

      # ------------------------------------------------------------------
      - name: Write manifest and resources
        if: steps.scaffold_check.outputs.needed == 'true'
        run: |
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Deliberately NO internet permission: the journal cannot leave the device. -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:name=".JournalApplication"
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Journal">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@style/Theme.Journal">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <receiver
                      android:name=".widget.JournalWidgetProvider"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.example.journal.WIDGET_REFRESH" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_journal_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Journal</string>
              <string name="widget_write">+ Write now</string>
              <string name="widget_empty">No entries yet — tap to start</string>
              <string name="widget_stats">%1$d day streak · %2$d entries · %3$d words</string>
              <string name="widget_description">Write in your journal straight from the home screen</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Journal" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="camera" path="camera/" />
          </paths>
          EOF

          cat > app/src/main/res/xml/widget_journal_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:initialLayout="@layout/widget_journal"
              android:description="@string/widget_description" />
          EOF

          cat > app/src/main/res/layout/widget_journal.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@drawable/widget_background"
              android:padding="14dp">

              <TextView
                  android:id="@+id/widget_title"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="@string/app_name"
                  android:textColor="#FFF2F2F2"
                  android:textSize="15sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/widget_stats"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:gravity="center_vertical"
                  android:text="@string/widget_empty"
                  android:textColor="#FFBDBDBD"
                  android:textSize="13sp" />

              <TextView
                  android:id="@+id/widget_action"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@drawable/widget_button"
                  android:gravity="center"
                  android:paddingTop="9dp"
                  android:paddingBottom="9dp"
                  android:text="@string/widget_write"
                  android:textColor="#FF0B1B33"
                  android:textSize="14sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          cat > app/src/main/res/drawable/widget_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#EE202124" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/widget_button.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#FF8AB4F8" />
              <corners android:radius="18dp" />
          </shape>
          EOF

      # ------------------------------------------------------------------
      - name: Write crypto and data helpers
        if: steps.scaffold_check.outputs.needed == 'true'
        run: |
          PKG=app/src/main/java/com/example/journal/data
          mkdir -p "$PKG"

          cat > "$PKG/CryptoManager.kt" <<'EOF'
          package com.example.journal.data

          import android.util.Base64
          import java.io.ByteArrayOutputStream
          import java.security.SecureRandom
          import javax.crypto.Cipher
          import javax.crypto.SecretKey
          import javax.crypto.SecretKeyFactory
          import javax.crypto.spec.GCMParameterSpec
          import javax.crypto.spec.PBEKeySpec
          import javax.crypto.spec.SecretKeySpec

          data class Encrypted(val cipherText: String, val iv: String)

          object CryptoManager {

              const val PBKDF2_ALGORITHM = "PBKDF2WithHmacSHA256"
              const val TRANSFORMATION = "AES/GCM/NoPadding"
              const val ITERATIONS = 210_000
              const val IV_BYTES = 12

              private const val KEY_BITS = 256
              private const val SALT_BYTES = 16
              private const val GCM_TAG_BITS = 128

              private val random = SecureRandom()

              fun newSalt(): ByteArray = ByteArray(SALT_BYTES).also(random::nextBytes)

              private fun newIv(): ByteArray = ByteArray(IV_BYTES).also(random::nextBytes)

              fun deriveKey(
                  password: CharArray,
                  salt: ByteArray,
                  iterations: Int = ITERATIONS,
              ): SecretKey {
                  val spec = PBEKeySpec(password, salt, iterations, KEY_BITS)
                  val factory = SecretKeyFactory.getInstance(PBKDF2_ALGORITHM)
                  val bytes = factory.generateSecret(spec).encoded
                  spec.clearPassword()
                  return SecretKeySpec(bytes, "AES")
              }

              fun encrypt(key: SecretKey, plaintext: String): Encrypted {
                  val iv = newIv()
                  val cipher = Cipher.getInstance(TRANSFORMATION)
                  cipher.init(Cipher.ENCRYPT_MODE, key, GCMParameterSpec(GCM_TAG_BITS, iv))
                  val body = cipher.doFinal(plaintext.toByteArray(Charsets.UTF_8))
                  return Encrypted(encode(body), encode(iv))
              }

              fun decrypt(key: SecretKey, cipherText: String, iv: String): String {
                  val cipher = Cipher.getInstance(TRANSFORMATION)
                  cipher.init(Cipher.DECRYPT_MODE, key, GCMParameterSpec(GCM_TAG_BITS, decode(iv)))
                  return String(cipher.doFinal(decode(cipherText)), Charsets.UTF_8)
              }

              /** Blob layout for attachments: [12-byte IV][GCM ciphertext]. */
              fun encryptBytes(key: SecretKey, plain: ByteArray): ByteArray {
                  val iv = newIv()
                  val cipher = Cipher.getInstance(TRANSFORMATION)
                  cipher.init(Cipher.ENCRYPT_MODE, key, GCMParameterSpec(GCM_TAG_BITS, iv))
                  val body = cipher.doFinal(plain)
                  return ByteArrayOutputStream(iv.size + body.size).apply {
                      write(iv)
                      write(body)
                  }.toByteArray()
              }

              fun decryptBytes(key: SecretKey, blob: ByteArray): ByteArray {
                  require(blob.size > IV_BYTES) { "Attachment is truncated." }
                  val iv = blob.copyOfRange(0, IV_BYTES)
                  val body = blob.copyOfRange(IV_BYTES, blob.size)
                  val cipher = Cipher.getInstance(TRANSFORMATION)
                  cipher.init(Cipher.DECRYPT_MODE, key, GCMParameterSpec(GCM_TAG_BITS, iv))
                  return cipher.doFinal(body)
              }

              fun encode(bytes: ByteArray): String = Base64.encodeToString(bytes, Base64.NO_WRAP)
              fun decode(text: String): ByteArray = Base64.decode(text, Base64.NO_WRAP)
          }
          EOF

          cat > "$PKG/AuthManager.kt" <<'EOF'
          package com.example.journal.data

          import android.content.Context
          import android.content.SharedPreferences
          import androidx.core.content.edit
          import javax.crypto.SecretKey

          /**
           * Holds the derived key in memory for the current session and stores the
           * salt plus an encrypted verifier blob used to check a password.
           */
          class AuthManager(context: Context) {

              private val prefs: SharedPreferences =
                  context.applicationContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              @Volatile
              private var sessionKey: SecretKey? = null

              val hasPassword: Boolean
                  get() = prefs.contains(KEY_SALT) &&
                          prefs.contains(KEY_VERIFIER) &&
                          prefs.contains(KEY_VERIFIER_IV)

              fun currentKey(): SecretKey = sessionKey ?: error("Journal is locked")
              fun currentKeyOrNull(): SecretKey? = sessionKey

              /** The PBKDF2 salt. Backups include it so a file can be opened elsewhere. */
              fun saltCopy(): ByteArray? =
                  prefs.getString(KEY_SALT, null)?.let(CryptoManager::decode)

              fun setupPassword(password: CharArray): Boolean {
                  if (hasPassword) return false
                  val salt = CryptoManager.newSalt()
                  val key = CryptoManager.deriveKey(password, salt)
                  writeVerifier(salt, key)
                  sessionKey = key
                  return true
              }

              fun unlock(password: CharArray): Boolean {
                  val salt = prefs.getString(KEY_SALT, null)?.let(CryptoManager::decode) ?: return false
                  val verifier = prefs.getString(KEY_VERIFIER, null) ?: return false
                  val iv = prefs.getString(KEY_VERIFIER_IV, null) ?: return false

                  val candidate = CryptoManager.deriveKey(password, salt)
                  val ok = try {
                      CryptoManager.decrypt(candidate, verifier, iv) == VERIFIER_TEXT
                  } catch (t: Throwable) {
                      false
                  }
                  if (ok) sessionKey = candidate
                  return ok
              }

              /** Used after a password change, when every entry has been re-encrypted. */
              fun replacePassword(newSalt: ByteArray, newKey: SecretKey) {
                  writeVerifier(newSalt, newKey)
                  sessionKey = newKey
              }

              fun lock() {
                  sessionKey = null
              }

              private fun writeVerifier(salt: ByteArray, key: SecretKey) {
                  val verifier = CryptoManager.encrypt(key, VERIFIER_TEXT)
                  prefs.edit(commit = true) {
                      putString(KEY_SALT, CryptoManager.encode(salt))
                      putString(KEY_VERIFIER, verifier.cipherText)
                      putString(KEY_VERIFIER_IV, verifier.iv)
                  }
              }

              private companion object {
                  const val PREFS_NAME = "journal_auth"
                  const val KEY_SALT = "salt"
                  const val KEY_VERIFIER = "verifier"
                  const val KEY_VERIFIER_IV = "verifier_iv"
                  const val VERIFIER_TEXT = "journal-unlock-check-v1"
              }
          }
          EOF

          cat > "$PKG/Payload.kt" <<'EOF'
          package com.example.journal.data

          import org.json.JSONArray
          import org.json.JSONObject

          /**
           * Everything encrypted for one entry. Mood, the hidden flag and the list of
           * encrypted photo filenames all live in here, so none of them is plaintext
           * on disk.
           */
          data class EntryPayload(
              val text: String,
              val mood: String? = null,
              val locked: Boolean = false,
              val attachments: List<String> = emptyList(),
          )

          object PayloadCodec {

              fun encode(payload: EntryPayload): String = JSONObject().apply {
                  put("v", 3)
                  put("text", payload.text)
                  payload.mood?.let { put("mood", it) }
                  if (payload.locked) put("locked", true)
                  if (payload.attachments.isNotEmpty()) {
                      put("attachments", JSONArray(payload.attachments))
                  }
              }.toString()

              /** Tolerates rows written before this format existed (raw text). */
              fun decode(raw: String): EntryPayload {
                  if (!raw.trimStart().startsWith("{")) return EntryPayload(raw)
                  return try {
                      val json = JSONObject(raw)
                      if (!json.has("text")) return EntryPayload(raw)
                      val attachments = json.optJSONArray("attachments")?.let { array ->
                          (0 until array.length())
                              .mapNotNull { array.optString(it).takeIf(String::isNotBlank) }
                      } ?: emptyList()
                      EntryPayload(
                          text = json.optString("text"),
                          mood = json.optString("mood").takeIf { it.isNotBlank() && !json.isNull("mood") },
                          locked = json.optBoolean("locked", false),
                          attachments = attachments,
                      )
                  } catch (t: Throwable) {
                      EntryPayload(raw)
                  }
              }
          }
          EOF

          cat > "$PKG/Tags.kt" <<'EOF'
          package com.example.journal.data

          /** Finds #tags anywhere in an entry. Letters, digits, underscore and dash. */
          object TagParser {

              private val tagRegex = Regex("""(?:^|\s)#([\p{L}\p{N}_-]{1,32})""")

              fun tagsOf(text: String): List<String> =
                  tagRegex.findAll(text)
                      .map { it.groupValues[1].lowercase() }
                      .distinct()
                      .toList()
          }
          EOF

          cat > "$PKG/AttachmentStore.kt" <<'EOF'
          package com.example.journal.data

          import android.content.Context
          import java.io.File
          import java.util.UUID
          import javax.crypto.SecretKey

          /**
           * Encrypted photo files live in filesDir/attachments as [IV][ciphertext].
           * Nothing writes a decrypted copy to disk: pictures are decrypted in memory
           * only, at the moment they are displayed.
           */
          class AttachmentStore(private val context: Context) {

              private val directory: File
                  get() = File(context.filesDir, "attachments").apply { if (!exists()) mkdirs() }

              fun save(key: SecretKey, bytes: ByteArray): String {
                  val name = UUID.randomUUID().toString().replace("-", "") + ".bin"
                  File(directory, name).writeBytes(CryptoManager.encryptBytes(key, bytes))
                  return name
              }

              fun load(key: SecretKey, name: String): ByteArray? {
                  val file = File(directory, name)
                  if (!file.isFile) return null
                  return runCatching { CryptoManager.decryptBytes(key, file.readBytes()) }.getOrNull()
              }

              fun delete(name: String) {
                  File(directory, name).delete()
              }

              /**
               * Deletes files no entry points at any more. Files younger than
               * [minAgeMillis] are left alone, so a picture attached to an entry that
               * is still open in the editor can never be swept away.
               */
              fun collectGarbage(referenced: Set<String>, minAgeMillis: Long = 60L * 60L * 1000L): Int {
                  val cutoff = System.currentTimeMillis() - minAgeMillis
                  var deleted = 0
                  directory.listFiles()?.forEach { file ->
                      if (file.name !in referenced && file.lastModified() < cutoff) {
                          if (file.delete()) deleted++
                      }
                  }
                  return deleted
              }
          }
          EOF

          cat > "$PKG/ImageCompressor.kt" <<'EOF'
          package com.example.journal.data

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import androidx.exifinterface.media.ExifInterface
          import java.io.ByteArrayInputStream
          import java.io.ByteArrayOutputStream

          /**
           * Shrinks a picture before it is encrypted. Photos are resized to at most
           * [MAX_DIMENSION] on the long edge and JPEG compressed, which keeps the
           * journal small enough to back up as one file.
           */
          object ImageCompressor {

              private const val MAX_DIMENSION = 1280
              private const val QUALITY = 75

              fun fromBytes(raw: ByteArray): ByteArray? {
                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeByteArray(raw, 0, raw.size, bounds)
                  if (bounds.outWidth <= 0 || bounds.outHeight <= 0) return null

                  var sample = 1
                  while (bounds.outWidth / (sample * 2) >= MAX_DIMENSION &&
                      bounds.outHeight / (sample * 2) >= MAX_DIMENSION
                  ) {
                      sample *= 2
                  }

                  val options = BitmapFactory.Options().apply { inSampleSize = sample }
                  val decoded = BitmapFactory.decodeByteArray(raw, 0, raw.size, options) ?: return null

                  val rotation = runCatching {
                      ByteArrayInputStream(raw).use { readRotation(ExifInterface(it)) }
                  }.getOrDefault(0)

                  val scaled = scaleDown(decoded, MAX_DIMENSION)
                  val oriented = if (rotation == 0) scaled else applyRotation(scaled, rotation)

                  val out = ByteArrayOutputStream()
                  oriented.compress(Bitmap.CompressFormat.JPEG, QUALITY, out)
                  return out.toByteArray()
              }

              private fun readRotation(exif: ExifInterface): Int =
                  when (exif.getAttributeInt(
                      ExifInterface.TAG_ORIENTATION,
                      ExifInterface.ORIENTATION_NORMAL,
                  )) {
                      ExifInterface.ORIENTATION_ROTATE_90 -> 90
                      ExifInterface.ORIENTATION_ROTATE_180 -> 180
                      ExifInterface.ORIENTATION_ROTATE_270 -> 270
                      else -> 0
                  }

              private fun scaleDown(bitmap: Bitmap, maxDimension: Int): Bitmap {
                  val largest = maxOf(bitmap.width, bitmap.height)
                  if (largest <= maxDimension) return bitmap
                  val ratio = maxDimension.toFloat() / largest
                  return Bitmap.createScaledBitmap(
                      bitmap,
                      (bitmap.width * ratio).toInt().coerceAtLeast(1),
                      (bitmap.height * ratio).toInt().coerceAtLeast(1),
                      true,
                  )
              }

              private fun applyRotation(bitmap: Bitmap, degrees: Int): Bitmap {
                  val matrix = Matrix().apply { postRotate(degrees.toFloat()) }
                  return Bitmap.createBitmap(bitmap, 0, 0, bitmap.width, bitmap.height, matrix, true)
              }
          }
          EOF

      # ------------------------------------------------------------------
      - name: Write database layer
        if: steps.scaffold_check.outputs.needed == 'true'
        run: |
          PKG=app/src/main/java/com/example/journal/data

          cat > "$PKG/Entry.kt" <<'EOF'
          package com.example.journal.data

          import androidx.room.ColumnInfo
          import androidx.room.Entity
          import androidx.room.PrimaryKey

          @Entity(tableName = "entries")
          data class Entry(
              @PrimaryKey(autoGenerate = true)
              val id: Long = 0L,

              /** Local calendar day the entry belongs to, ISO-8601 (yyyy-MM-dd). */
              @ColumnInfo(name = "entry_date")
              val entryDate: String,

              /** Wall-clock moment the text was first written. Hidden by default. */
              @ColumnInfo(name = "created_at")
              val createdAt: Long,

              /** Last edit time. */
              @ColumnInfo(name = "updated_at")
              val updatedAt: Long,

              /** AES-256-GCM ciphertext, Base64 (NO_WRAP). */
              @ColumnInfo(name = "cipher_text")
              val cipherText: String,

              /** 12-byte GCM nonce, Base64 (NO_WRAP). */
              @ColumnInfo(name = "iv")
              val iv: String,
          )
          EOF

          cat > "$PKG/JournalEntry.kt" <<'EOF'
          package com.example.journal.data

          import java.time.LocalDate

          /** Decrypted, in-memory representation of an entry. */
          data class JournalEntry(
              val id: Long,
              val date: LocalDate,
              val createdAt: Long,
              val updatedAt: Long,
              val text: String,
              val mood: String? = null,
              val locked: Boolean = false,
              val attachments: List<String> = emptyList(),
              val tags: List<String> = emptyList(),
          )
          EOF

          cat > "$PKG/EntryDao.kt" <<'EOF'
          package com.example.journal.data

          import androidx.room.Dao
          import androidx.room.Insert
          import androidx.room.Query
          import androidx.room.Update
          import kotlinx.coroutines.flow.Flow

          @Dao
          interface EntryDao {

              @Query("SELECT * FROM entries ORDER BY entry_date DESC, created_at ASC")
              fun observeAll(): Flow<List<Entry>>

              @Query("SELECT * FROM entries ORDER BY entry_date DESC, created_at ASC")
              suspend fun getAll(): List<Entry>

              @Query("SELECT * FROM entries WHERE id = :id LIMIT 1")
              suspend fun getById(id: Long): Entry?

              @Insert
              suspend fun insert(entry: Entry): Long

              @Insert
              suspend fun insertAll(entries: List<Entry>): List<Long>

              @Update
              suspend fun update(entry: Entry)

              @Update
              suspend fun updateAll(entries: List<Entry>)

              @Query("DELETE FROM entries WHERE id = :id")
              suspend fun deleteById(id: Long)
          }
